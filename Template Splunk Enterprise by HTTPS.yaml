zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: d141c067ae2a49ccb5a1565354fb07e7
      template: 'Template Splunk Enterprise by HTTPS'
      name: 'Template Splunk Enterprise by HTTPS'
      description: |
        Template Splunk Enterprise by HTTPS using REST Api
        
        @author: Guille Rodriguez Gonzalez 
        @github: https://github.com/guillerg86/
        @linkedin: www.linkedin.com/in/guille-rodriguez-gonzalez
        
        Splunk REST API Doc: https://help.splunk.com/en/splunk-enterprise/rest-api-reference/10.0/introduction/endpoints-reference-list
      groups:
        - name: Templates/Applications
      items:
        - uuid: 22fab2ffd7aa492e95ea9b8b1c19fef9
          name: 'Splunk ES License Quota Peers Used'
          type: HTTP_AGENT
          key: splunk.enterprise.licenser.usage.license_usage.peers_usage_bytes
          delay: 5m
          units: B
          authtype: BASIC
          username: '{$SPLUNK.ENTERPRISE.API.USER}'
          password: '{$SPLUNK.ENTERPRISE.API.PASSWORD}'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.entry[0].content.peers_usage_bytes'
          url: '{$SPLUNK.ENTERPRISE.API.BASEURL}/services/licenser/usage/license_usage'
          query_fields:
            - name: output_mode
              value: json
          tags:
            - tag: Application
              value: 'Splunk Enterprise'
            - tag: Application
              value: 'Splunk Enterprise License'
          triggers:
            - uuid: 9e8d1949cbb3416595fa7c6d268f82e7
              expression: 'nodata(/Template Splunk Enterprise by HTTPS/splunk.enterprise.licenser.usage.license_usage.peers_usage_bytes,30m)=1'
              name: 'Splunk API License: No data for more than 30min'
              url_name: 'Splunk API Licenser'
              url: 'https://help.splunk.com/en/splunk-enterprise/rest-api-reference/10.0/license-endpoints/license-endpoint-descriptions#id_2bf8cc9a_35f5_4e58_878e_5db7c34a89dc--en__licenser.2Flicenses'
              priority: HIGH
        - uuid: 2287522f611f4ddd8d866df4c12a06bc
          name: 'Splunk ES License Quota Total'
          type: HTTP_AGENT
          key: splunk.enterprise.licenser.usage.license_usage.quota
          delay: 1d
          units: B
          authtype: BASIC
          username: '{$SPLUNK.ENTERPRISE.API.USER}'
          password: '{$SPLUNK.ENTERPRISE.API.PASSWORD}'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.entry[0].content.quota'
          url: '{$SPLUNK.ENTERPRISE.API.BASEURL}/services/licenser/usage/license_usage'
          query_fields:
            - name: output_mode
              value: json
          tags:
            - tag: Application
              value: 'Splunk Enterprise'
            - tag: Application
              value: 'Splunk Enterprise License'
        - uuid: 4d7a4122883a42c08a2b5ca431e73f19
          name: 'Splunk ES License Quota Used in perc'
          type: CALCULATED
          key: splunk.enterprise.licenser.usage.license_usage.quota_used_perc
          delay: 10m
          value_type: FLOAT
          units: '%'
          params: '100*(last(//splunk.enterprise.licenser.usage.license_usage.peers_usage_bytes) / last(//splunk.enterprise.licenser.usage.license_usage.quota))'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return Number(value).toFixed(1);'
          tags:
            - tag: Application
              value: 'Splunk Enterprise'
            - tag: Application
              value: 'Splunk Enterprise License'
          triggers:
            - uuid: 6f9b49ca588548709ee53e452ec05ca4
              expression: 'last(/Template Splunk Enterprise by HTTPS/splunk.enterprise.licenser.usage.license_usage.quota_used_perc)>=100'
              name: 'Splunk License quota usage is 100%'
              priority: DISASTER
              dependencies:
                - name: 'Splunk API License: No data for more than 30min'
                  expression: 'nodata(/Template Splunk Enterprise by HTTPS/splunk.enterprise.licenser.usage.license_usage.peers_usage_bytes,30m)=1'
            - uuid: 0185122491ff4713b8be8d14b4663cc0
              expression: 'last(/Template Splunk Enterprise by HTTPS/splunk.enterprise.licenser.usage.license_usage.quota_used_perc)>80'
              name: 'Splunk License quota usage is over 80%'
              opdata: '{ITEM.LASTVALUE}%'
              priority: WARNING
              dependencies:
                - name: 'Splunk License quota usage is over 90%'
                  expression: 'last(/Template Splunk Enterprise by HTTPS/splunk.enterprise.licenser.usage.license_usage.quota_used_perc)>90'
            - uuid: e60e7d846e6b4e858693102f02ec0097
              expression: 'last(/Template Splunk Enterprise by HTTPS/splunk.enterprise.licenser.usage.license_usage.quota_used_perc)>90'
              name: 'Splunk License quota usage is over 90%'
              opdata: '{ITEM.LASTVALUE}%'
              priority: AVERAGE
              dependencies:
                - name: 'Splunk License quota usage is over 95%'
                  expression: 'last(/Template Splunk Enterprise by HTTPS/splunk.enterprise.licenser.usage.license_usage.quota_used_perc)>95'
            - uuid: e32e51dc66c94fb9addced6994cc2372
              expression: 'last(/Template Splunk Enterprise by HTTPS/splunk.enterprise.licenser.usage.license_usage.quota_used_perc)>95'
              name: 'Splunk License quota usage is over 95%'
              opdata: '{ITEM.LASTVALUE}%'
              priority: HIGH
              dependencies:
                - name: 'Splunk License quota usage is 100%'
                  expression: 'last(/Template Splunk Enterprise by HTTPS/splunk.enterprise.licenser.usage.license_usage.quota_used_perc)>=100'
        - uuid: cf9a15f3e3864b058c3e24c420d37f90
          name: 'Splunk ES License Quota Slaves Used'
          type: HTTP_AGENT
          key: splunk.enterprise.licenser.usage.license_usage.slaves_usage_bytes
          delay: 5m
          units: B
          authtype: BASIC
          username: '{$SPLUNK.ENTERPRISE.API.USER}'
          password: '{$SPLUNK.ENTERPRISE.API.PASSWORD}'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.entry[0].content.slaves_usage_bytes'
          url: '{$SPLUNK.ENTERPRISE.API.BASEURL}/services/licenser/usage/license_usage'
          query_fields:
            - name: output_mode
              value: json
          tags:
            - tag: Application
              value: 'Splunk Enterprise'
            - tag: Application
              value: 'Splunk Enterprise License'
        - uuid: 8b17b508b9174cb4a683bd37584aeb9d
          name: 'Splunk ES Splunkd Overall Health'
          type: DEPENDENT
          key: splunk.enterprise.server.health.splunkd.details.health
          history: 7d
          description: 'Check https://help.splunk.com/en/splunk-enterprise/rest-api-reference/10.0/introspection-endpoints/introspection-endpoint-descriptions#id_50cfdccb_0f97_431a_9518_d8cf1ebd9519--en__Introspection_endpoint_descriptions'
          valuemap:
            name: 'Health Status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.health
            - type: JAVASCRIPT
              parameters:
                - |
                  switch(value) {
                  	case "green": return 0;
                  	case "yellow": return 1;
                  	case "red": return 2;
                  }
          master_item:
            key: splunk.enterprise.server.health.splunkd.details.raw
          tags:
            - tag: Application
              value: 'Splunk Enterprise'
            - tag: Application
              value: 'Splunk Enterprise Health'
