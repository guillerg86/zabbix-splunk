      discovery_rules:
        - uuid: 31a68cb8cd2a497d9ae92721b58754ce
          name: 'Discovery Licenses'
          type: HTTP_AGENT
          key: splunk.enterprise.licenses.discovery
          delay: 1h
          authtype: BASIC
          username: '{$SPLUNK.ENTERPRISE.API.USER}'
          password: '{$SPLUNK.ENTERPRISE.API.PASSWORD}'
          filter:
            conditions:
              - macro: '{#SPL.ENTERPRISE.LIC.NAME}'
                value: '{$SPL.ENTERPRISE.LIC.NOTMATCHES}'
                operator: NOT_MATCHES_REGEX
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 6h
          item_prototypes:
            - uuid: 709ffdf3a61446fcb3b420de4d807f34
              name: 'Splunk ES Creation Time License: {#SPL.ENTERPRISE.LIC.NAME}'
              type: HTTP_AGENT
              key: 'splunk.enterprise.license.creation_time[{#SPL.ENTERPRISE.LIC.NAME}]'
              delay: 1d
              units: unixtime
              authtype: BASIC
              username: '{$SPLUNK.ENTERPRISE.API.USER}'
              password: '{$SPLUNK.ENTERPRISE.API.PASSWORD}'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.entry[0].content.creation_time'
              url: 'https://{HOST.CONN}:8089/services/licenser/licenses/{#SPL.ENTERPRISE.LIC.NAME}'
              query_fields:
                - name: output_mode
                  value: json
              tags:
                - tag: Application
                  value: 'Splunk Enterprise'
                - tag: Application
                  value: 'Splunk Enterprise License {#SPL.ENTERPRISE.LIC.NAME}'
                - tag: 'Splunk Enterprise'
                  value: 'Splunk Enterprise License'
            - uuid: 4fb7203b5ed543b4997e74e5cf79e0e8
              name: 'Splunk ES Days left to expiration License: {#SPL.ENTERPRISE.LIC.NAME}'
              type: CALCULATED
              key: 'splunk.enterprise.license.daystoexpire[{#SPL.ENTERPRISE.LIC.NAME}]'
              delay: 1h
              value_type: FLOAT
              params: '(last( //splunk.enterprise.license.expiration_time[{#SPL.ENTERPRISE.LIC.NAME}]) - now() ) / 86400'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'return Number(value).toFixed(1);'
              tags:
                - tag: Application
                  value: 'Splunk Enterprise'
                - tag: Application
                  value: 'Splunk Enterprise License'
                - tag: Application
                  value: 'Splunk Enterprise License {#SPL.ENTERPRISE.LIC.NAME}'
              trigger_prototypes:
                - uuid: 14eb0b9786fb43cb898a68918138eebf
                  expression: 'last(/Template Splunk Enterprise by HTTPS/splunk.enterprise.license.daystoexpire[{#SPL.ENTERPRISE.LIC.NAME}]) < 0'
                  name: 'License {#SPL.ENTERPRISE.LIC.NAME} is expired!'
                  priority: DISASTER
                  description: 'License has expired. Add a new license if no other valid license is available and remove this license from Splunk > Settings > Licesing section'
                - uuid: b74ce214765d4147b53b770e298490d7
                  expression: 'last(/Template Splunk Enterprise by HTTPS/splunk.enterprise.license.daystoexpire[{#SPL.ENTERPRISE.LIC.NAME}]) < {$SPLUNK.ENTERPRISE.LICEXP.DAYS_AVG}'
                  name: 'License {#SPL.ENTERPRISE.LIC.NAME} will expire soon'
                  opdata: '{ITEM.LASTVALUE}d left'
                  priority: AVERAGE
                  description: 'License will expire in less than {$SPLUNK.ENTERPRISE.LICEXP.DAYS_AVG} day/days'
                  dependencies:
                    - name: 'License {#SPL.ENTERPRISE.LIC.NAME} will expire soon'
                      expression: 'last(/Template Splunk Enterprise by HTTPS/splunk.enterprise.license.daystoexpire[{#SPL.ENTERPRISE.LIC.NAME}]) < {$SPLUNK.ENTERPRISE.LICEXP.DAYS_HIGH}'
                - uuid: 2092606f5271464098db5e9def3858b1
                  expression: 'last(/Template Splunk Enterprise by HTTPS/splunk.enterprise.license.daystoexpire[{#SPL.ENTERPRISE.LIC.NAME}]) < {$SPLUNK.ENTERPRISE.LICEXP.DAYS_CRITICAL}'
                  name: 'License {#SPL.ENTERPRISE.LIC.NAME} will expire soon'
                  opdata: '{ITEM.LASTVALUE}d left'
                  priority: DISASTER
                  description: 'License will expire in less than {$SPLUNK.ENTERPRISE.LICEXP.DAYS_CRITICAL} day/days'
                  dependencies:
                    - name: 'License {#SPL.ENTERPRISE.LIC.NAME} is expired!'
                      expression: 'last(/Template Splunk Enterprise by HTTPS/splunk.enterprise.license.daystoexpire[{#SPL.ENTERPRISE.LIC.NAME}]) < 0'
                - uuid: 28fe35d59c3f40298a5f862d3509bca7
                  expression: 'last(/Template Splunk Enterprise by HTTPS/splunk.enterprise.license.daystoexpire[{#SPL.ENTERPRISE.LIC.NAME}]) < {$SPLUNK.ENTERPRISE.LICEXP.DAYS_HIGH}'
                  name: 'License {#SPL.ENTERPRISE.LIC.NAME} will expire soon'
                  opdata: '{ITEM.LASTVALUE}d left'
                  priority: HIGH
                  description: 'License will expire in less than {$SPLUNK.ENTERPRISE.LICEXP.DAYS_HIGH} day/days'
                  dependencies:
                    - name: 'License {#SPL.ENTERPRISE.LIC.NAME} will expire soon'
                      expression: 'last(/Template Splunk Enterprise by HTTPS/splunk.enterprise.license.daystoexpire[{#SPL.ENTERPRISE.LIC.NAME}]) < {$SPLUNK.ENTERPRISE.LICEXP.DAYS_CRITICAL}'
                - uuid: ba6e44690e604dc2befa5776a0647d5b
                  expression: 'last(/Template Splunk Enterprise by HTTPS/splunk.enterprise.license.daystoexpire[{#SPL.ENTERPRISE.LIC.NAME}]) < {$SPLUNK.ENTERPRISE.LICEXP.DAYS_INFO}'
                  name: 'License {#SPL.ENTERPRISE.LIC.NAME} will expire soon'
                  opdata: '{ITEM.LASTVALUE}d left'
                  priority: INFO
                  description: 'License will expire in less than {$SPLUNK.ENTERPRISE.LICEXP.DAYS_INFO} day/days'
                  dependencies:
                    - name: 'License {#SPL.ENTERPRISE.LIC.NAME} will expire soon'
                      expression: 'last(/Template Splunk Enterprise by HTTPS/splunk.enterprise.license.daystoexpire[{#SPL.ENTERPRISE.LIC.NAME}]) < {$SPLUNK.ENTERPRISE.LICEXP.DAYS_WARN}'
                - uuid: f76815a0c1914488af8ac9a7632d0997
                  expression: 'last(/Template Splunk Enterprise by HTTPS/splunk.enterprise.license.daystoexpire[{#SPL.ENTERPRISE.LIC.NAME}]) < {$SPLUNK.ENTERPRISE.LICEXP.DAYS_WARN}'
                  name: 'License {#SPL.ENTERPRISE.LIC.NAME} will expire soon'
                  opdata: '{ITEM.LASTVALUE}d left'
                  priority: WARNING
                  description: 'License will expire in less than {$SPLUNK.ENTERPRISE.LICEXP.DAYS_WARN} day/days'
                  dependencies:
                    - name: 'License {#SPL.ENTERPRISE.LIC.NAME} will expire soon'
                      expression: 'last(/Template Splunk Enterprise by HTTPS/splunk.enterprise.license.daystoexpire[{#SPL.ENTERPRISE.LIC.NAME}]) < {$SPLUNK.ENTERPRISE.LICEXP.DAYS_AVG}'
            - uuid: ba26fd58717d4d16b8b2fc964c604112
              name: 'Splunk ES Expiration Time License: {#SPL.ENTERPRISE.LIC.NAME}'
              type: HTTP_AGENT
              key: 'splunk.enterprise.license.expiration_time[{#SPL.ENTERPRISE.LIC.NAME}]'
              delay: 1d
              units: unixtime
              authtype: BASIC
              username: '{$SPLUNK.ENTERPRISE.API.USER}'
              password: '{$SPLUNK.ENTERPRISE.API.PASSWORD}'
              preprocessing:
