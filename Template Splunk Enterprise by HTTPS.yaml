        - uuid: 749b81a708564da3bee553969eb3a54d
          name: 'Splunk ES Server Settings Raw'
          type: HTTP_AGENT
          key: splunk.enterprise.server.settings.raw
          delay: 5m
          history: '0'
          value_type: TEXT
          authtype: BASIC
          username: '{$SPLUNK.ENTERPRISE.API.USER}'
          password: '{$SPLUNK.ENTERPRISE.API.PASSWORD}'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.entry[0].content'
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  
                  var obj = data;
                  if (obj && typeof obj === 'object') {
                  	// Eliminar claves si existen
                      if (obj.hasOwnProperty('pass4SymmKey')) {
                      	delete obj.pass4SymmKey;
                      }
                  }
                  return JSON.stringify(data);
          url: '{$SPLUNK.ENTERPRISE.API.BASEURL}/services/server/settings'
          query_fields:
            - name: output_mode
              value: json
          tags:
            - tag: Application
              value: 'Splunk Enterprise'
            - tag: Application
              value: 'Splunk Enterprise Server Settings'
            - tag: Application
              value: 'Zabbix raw items'
          triggers:
